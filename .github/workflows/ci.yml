name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m alembic check && python -m pytest -q
      - name: Install Playwright dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E and accessibility tests
        run: npm run test:e2e
      - name: Run cross-browser smoke
        run: npm run test:e2e:all-browsers
      - name: Run production rehearsal
        run: npm run test:e2e:production
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit bandit
          python -m pip_audit -r backend/requirements.txt
          python -m bandit -q -r backend/app -x backend/app/static
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
